[build-system]
requires = ["setuptools>=61,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudonymizer"
version = "0.1.0"
description = "Сервис псевдонимизации персональных данных в русском тексте"
requires-python = ">=3.12"
dependencies = [
    "natasha>=1.6,<2",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru",
    "setuptools>=61,<81",  # natasha/pymorphy2 импортируют pkg_resources
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["pseudonymizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
