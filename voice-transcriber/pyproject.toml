[build-system]
requires = ["setuptools>=61,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-transcriber"
version = "0.1.0"
description = "Локальная расшифровка голосовых сообщений (faster-whisper, CPU)"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2,<2",
    # faster-whisper 1.2.1 не работает с PyAV 19 (decode_audio), поэтому свой декодер в
    # audio.py; верхняя граница страхует и его от смены API
    "av>=14,<20",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["voice_transcriber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужны веса модели (VOICE_MODEL_DIR) и синтезированная речь"]
filterwarnings = ["ignore::DeprecationWarning"]
