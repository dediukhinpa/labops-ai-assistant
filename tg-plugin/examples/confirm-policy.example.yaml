# Политика confirm-gate — подтверждение изменяющих операций в Telegram.
#
# Копируется в ~/.claude-lab/<agent>/.claude/confirm-policy.yaml,
# путь передаётся плагину через CONFIRM_POLICY_PATH.
#
# enforce — гейт работает.
# off     — аварийный рубильник. Требует рестарта сессии агента.
#
# Порядок применения правил (первое совпадение выигрывает):
#   1. mode: off                      → сквозной пропуск
#   2. overrides.deny                 → блок без вопроса
#   3. overrides.allow                → пропуск молча
#   4. tool_input.method              → по таблице HTTP-методов
#   5. Bash: глагол в URL, затем HTTP-метод, затем confirm_patterns
#   6. глагол в имени инструмента     → read пропускаем, остальное спрашиваем
#   7. глагол неизвестен              → СПРАШИВАЕМ
#
# Пункт 7 — главный. Новая бизнес-интеграция с незнакомым инструментом
# спросит, а не проскочит. Именно это делает гейт независимым от названия
# сервиса: 1С, amoCRM, Bitrix24, Teamly, Yandex Tracker, Yandex Disk, HH.ru
# и всё, что подключат позже, работают без правки этого файла.

mode: enforce

overrides:
  # Только собственная инфраструктура и читающие утилиты.
  #
  # Бизнес-интеграции клиента сюда НЕ добавляются: они и есть то, ради чего
  # существует гейт. Исключение для конкретного их инструмента — осознанное
  # решение оператора под запись, а не настройка по умолчанию.
  allow:
    - "mcp__second_brain-*__*"
    - "mcp__gbrain-*__*"
    # firecrawl читает страницы; его глаголы (scrape/crawl/map/extract)
    # отсутствуют в таблицах и иначе спрашивали бы на каждом вызове.
    - "mcp__firecrawl__*"

  # Никогда, даже с подтверждением: массовое удаление необратимо, а цена
  # ошибочного нажатия слишком велика.
  deny:
    - "mcp__*__*bulk_delete*"
    - "mcp__*__*delete_all*"

bash:
  # Подстрока, без учёта регистра.
  #
  # HTTP-методы (-X DELETE, --request PATCH, -d без -X) и глаголы в URL
  # ловятся кодом отдельно — здесь их дублировать не нужно.
  confirm_patterns:
    # permissions.deny из settings.json под --dangerously-skip-permissions
    # не действует, так что локальные разрушающие команды прикрываются здесь.
    - "sudo "
    - "rm -rf"
    - "drop table"
    - "truncate table"
    # Правка самой политики и настроек агента — тоже под подтверждение:
    # иначе гейт снимается одной командой Bash.
    - "confirm-policy.yaml"
    - "settings.json"
