<svg width="600" height="380" viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" role="img" aria-label="Telegram chat demo: receive, eyes reaction, reply, ok reaction">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#7C4DEF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#4C1D95" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="599" height="379" rx="18" fill="#F3F0FA" stroke="#E2DAF5"/>
  <!-- header -->
  <path d="M0 18 Q0 0 18 0 H582 Q600 0 600 18 V56 H0 Z" fill="url(#hg)"/>
  <circle cx="34" cy="28" r="15" fill="#ffffff"/>
  <text x="34" y="33" font-size="15" font-weight="800" fill="#7C4DEF" text-anchor="middle">D</text>
  <text x="60" y="25" font-size="16" font-weight="700" fill="#ffffff">Developer</text>
  <text x="143" y="25" font-size="16" font-weight="400" fill="#E9DEFF">· LabOps</text>
  <circle cx="64" cy="40" r="3.5" fill="#34D399"/>
  <text x="74" y="44" font-size="12" fill="#E9DEFF">online · powered by Claude</text>

  <!-- operator incoming message (right) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.09;0.93;1" dur="10s" repeatCount="indefinite"/>
    <rect x="296" y="80" width="280" height="46" rx="14" fill="#8B5CF6" filter="url(#sh)"/>
    <text x="316" y="108" font-size="16" fill="#ffffff">Pull yesterday's sales digest</text>
  </g>

  <!-- 👀 received reaction -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.16;0.48;0.52;1" dur="10s" repeatCount="indefinite"/>
    <rect x="512" y="130" width="50" height="26" rx="13" fill="#ffffff" stroke="#E2DAF5" filter="url(#sh)"/>
    <text x="537" y="148" font-size="14" text-anchor="middle">👀</text>
  </g>
  <!-- 👌 done reaction (replaces 👀) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.54;0.93;1" dur="10s" repeatCount="indefinite"/>
    <rect x="512" y="130" width="50" height="26" rx="13" fill="#ffffff" stroke="#C9B8F2" filter="url(#sh)"/>
    <text x="537" y="148" font-size="14" text-anchor="middle">👌</text>
  </g>

  <!-- typing indicator (left) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.26;0.42;0.46;1" dur="10s" repeatCount="indefinite"/>
    <rect x="24" y="176" width="84" height="40" rx="14" fill="#ffffff" stroke="#E2DAF5" filter="url(#sh)"/>
    <circle cx="48" cy="196" r="4.5" fill="#B6A4E8"><animate attributeName="cy" values="196;189;196" dur="0.9s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="66" cy="196" r="4.5" fill="#B6A4E8"><animate attributeName="cy" values="196;189;196" dur="0.9s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="84" cy="196" r="4.5" fill="#B6A4E8"><animate attributeName="cy" values="196;189;196" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- bot reply (left) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.52;0.93;1" dur="10s" repeatCount="indefinite"/>
    <rect x="24" y="176" width="392" height="150" rx="14" fill="#ffffff" stroke="#E2DAF5" filter="url(#sh)"/>
    <text x="44" y="206" font-size="16" font-weight="700" fill="#2E1065">Done — pulled the digest:</text>
    <text x="44" y="236" font-size="15" fill="#3B2A66">• Revenue +12% vs. the prior day</text>
    <text x="44" y="262" font-size="15" fill="#3B2A66">• 3 deals closed, 1 awaiting sign-off</text>
    <text x="44" y="288" font-size="15" fill="#3B2A66">• ⚠ 1 churn risk flagged → noted in brain</text>
    <text x="44" y="314" font-size="13" fill="#8B7BB8">saved to second_brain · 9:41</text>
  </g>
</svg>
