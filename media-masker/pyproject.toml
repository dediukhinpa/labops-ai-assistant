[build-system]
requires = ["setuptools>=61,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "media-masker"
version = "0.1.0"
description = "Сервис маскирования фото и PDF (ПДн закрашиваются, лица пикселизируются)"
requires-python = ">=3.12"
dependencies = [
    # Детектор ПДн берётся из соседнего пакета: pip install -e ../pseudonymizer
    "pseudonymizer",
    "pillow>=11",
    # Строго 4.x: в 5.x пакет headless не содержит каскадов Хаара (cv2.data пуст)
    "opencv-python-headless>=4.10,<5",
    "pypdfium2>=4.30",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["media_masker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
