# Installed by labops install.sh into /etc/needrestart/conf.d/labops-agents.conf.
#
# Не даём needrestart перезапускать службы агентов после обновления пакетов.
# 27.11.2026: unattended-upgrades прошёл четырьмя заходами за минуту, после
# каждого needrestart перезапускал claude-agent-*; агент получил 6 стартов за
# 2 минуты, упёрся в StartLimitBurst юнита и час молчал в Telegram.
# Агент держит живую сессию — перезапускать его должен оператор или watchdog,
# а не пакетный менеджер. Обновления ставятся как прежде.
$nrconf{override_rc}->{qr(^claude-agent-.+\.service$)} = 0;
